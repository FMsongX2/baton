name: baton
description: "Tempo-driven sheet music page turner with an accurate metronome."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 오디오 엔진. getEngineTime()이 앱 전체의 마스터 시계
  flutter_soloud: ^4.1.7
  # PDF 렌더. pagePaintCallbacks로 주석 오버레이
  pdfrx: ^2.5.0
  perfect_freehand: ^2.5.2+1
  # ML Kit(Android)/VisionKit(iOS) 네이티브 스캐너
  cunning_document_scanner: ^3.0.2

  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter_riverpod: ^2.6.1

  path_provider: ^2.1.6
  file_picker: ^12.1.3
  image_picker: ^1.2.3
  pdf: ^3.13.0
  archive: ^4.0.9
  share_plus: ^13.3.0
  wakelock_plus: ^1.8.0
  in_app_purchase: ^3.3.0
  path: ^1.9.1
  http: ^1.6.0
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.16.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
