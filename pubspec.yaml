name: baton
description: "Tempo-driven sheet music page turner with an accurate metronome."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  # 한국어 전용. Material·Cupertino 기본 문구(툴팁·선택 툴바·날짜)를 한국어로
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 오디오 엔진. getEngineTime()이 앱 전체의 마스터 시계
  flutter_soloud: ^4.1.7
  # PDF 렌더. pagePaintCallbacks로 주석 오버레이
  pdfrx: ^2.5.0
  perfect_freehand: ^2.5.2+1
  # ML Kit(Android)/VisionKit(iOS) 네이티브 스캐너
  cunning_document_scanner: ^3.0.2

  drift: ^2.34.3
  drift_flutter: ^0.3.1
  # drift가 이미 쓰는 것. 되살리기 전에 백업 DB를 drift 밖에서 열어 검사할 때 씀
  sqlite3: ^3.5.2
  flutter_riverpod: ^2.6.1

  path_provider: ^2.1.6
  file_picker: ^12.1.3
  image_picker: ^1.2.3
  pdf: ^3.13.0
  # PNG 등 JPEG가 아닌 가져오기 이미지를 쪽마다 JPEG로 바꿈. pdf가 이미 쓰는 순수 Dart 패키지
  image: ^4.9.2
  archive: ^4.0.9
  share_plus: ^13.3.0
  wakelock_plus: ^1.8.0
  in_app_purchase: ^3.3.0
  # 코인 구매를 서버 적립 뒤에 직접 소비(consumePurchase)하려고 씀. in_app_purchase가 이미 끌어오는 판
  in_app_purchase_android: ^0.5.3
  path: ^1.9.1
  http: ^1.6.0
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.16.0
  # 구매 테스트에서 스토어 플랫폼 대역을 끼움. in_app_purchase가 이미 끌어오는 판
  in_app_purchase_platform_interface: ^1.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
